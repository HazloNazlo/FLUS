name: FLUS TEST APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: flus-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: vendor/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Flutter tests
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Core tests and Android build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$ANDROID_NDK_HOME" || { echo 'Required preinstalled NDK 27.0.12077973 is missing'; exit 1; }
          (cd vendor && go test ./socks5)
          bash scripts/build-core.sh
      - name: Debug APK on every push
        run: flutter build apk --debug --target-platform android-arm64
      - name: Android unit tests
        run: cd android && ./gradlew :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: FLUS-TEST-debug-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Configure test signing
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        env:
          FLUS_KEYSTORE_BASE64: ${{ secrets.FLUS_KEYSTORE_BASE64 }}
          FLUS_SIGNING_JSON: ${{ secrets.FLUS_SIGNING_JSON }}
        run: python3 scripts/ci-signing.py
      - name: Signed TEST release APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: |
          flutter build apk --release --target-platform android-arm64
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/FLUS-TEST-arm64-v8a.apk
          cd artifacts && sha256sum FLUS-TEST-arm64-v8a.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          name: FLUS-TEST-release-arm64
          path: artifacts/*
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f android/release-key.jks android/key.properties

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FLUS-TEST-release-arm64
          path: artifacts
      - name: Publish only as prerelease, never Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --latest=false --title "FLUS TEST $TAG"
          else
            gh release create "$TAG" --verify-tag --prerelease --latest=false \
              --title "FLUS TEST $TAG" --notes "Экспериментальная сборка FLUS для Android 8+ arm64. Не стабильный релиз. Настройте SOCKS5 127.0.0.1:1080 в RX-PRO/NekoBox и обязательно исключите FLUS из VPN. Exit-node должен использовать тот же Yandex Docs URL. Подробности и ограничения — в README. Проверка на вашем телефоне и VPS обязательна."
          fi
          gh release upload "$TAG" artifacts/* --clobber
