name: Build Windows Binary
on: workflow_dispatch
jobs:
  build-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: vendor/go.sum
      - name: Build Windows binary
        run: |
          cd vendor
          go mod tidy
          GOOS=windows GOARCH=amd64 go build -o openflux.exe .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openflux-windows-amd64
          path: vendor/openflux.exe
